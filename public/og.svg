<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e5efe8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#3fd68f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3fd68f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c110e"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#263229" stroke-width="1.5"/>
  <!-- corner ticks -->
  <path d="M14 44V24a10 10 0 0 1 10-10h20M1156 14h20a10 10 0 0 1 10 10v20M1186 586v20a10 10 0 0 1-10 10h-20M44 616H24a10 10 0 0 1-10-10v-20" fill="none" stroke="#3fd68f" stroke-width="2.5"/>
  <!-- eyebrow -->
  <text x="92" y="150" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="24" letter-spacing="7" fill="#3fd68f">// A LIVING CURRICULUM · ZERO TO MASTERY</text>
  <!-- headline -->
  <text x="86" y="272" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="700" font-size="104" fill="#e5efe8">FULL-STACK</text>
  <text x="86" y="384" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="700" font-size="104" fill="#e5efe8">WEB DEV<tspan fill="#3fd68f">.</tspan></text>
  <!-- sub -->
  <text x="92" y="452" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="26" fill="#a8bcad">80 lessons · 11 volumes · 11 gauntlets · 365 flashcards</text>
  <!-- terminal card -->
  <g transform="translate(760 330) rotate(-2)">
    <rect x="10" y="12" width="360" height="210" rx="12" fill="#101814" stroke="#263229" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="6" fill="#e87f73"/><circle cx="58" cy="38" r="6" fill="#e3a94e"/><circle cx="80" cy="38" r="6" fill="#3fd68f"/>
    <text x="104" y="44" font-family="ui-monospace, monospace" font-size="14" fill="#63776b">zm — course console</text>
    <text x="32" y="92" font-family="ui-monospace, monospace" font-size="19" fill="#8ce9bb">$ zm status --course</text>
    <text x="32" y="128" font-family="ui-monospace, monospace" font-size="17" fill="#a8bcad">volumes   11/11 complete</text>
    <text x="32" y="160" font-family="ui-monospace, monospace" font-size="17" fill="#a8bcad">progress  ██████████ 100%</text>
    <text x="32" y="196" font-family="ui-monospace, monospace" font-size="17" fill="#e3c58a">certified ▸ /completion</text>
  </g>
  <!-- bottom meta -->
  <text x="92" y="560" font-family="ui-monospace, monospace" font-size="18" fill="#63776b">learn → practice → break → debug → quiz → ship</text>
</svg>
